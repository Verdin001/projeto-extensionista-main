<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Alertas - Somente Visualização</title>
    <style>
        body { 
            background-color: #121212; 
            color: white; 
            font-family: Arial, sans-serif; 
            padding: 20px; 
        }
        .alerta-card { 
            background-color: #ff3333; 
            padding: 20px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            font-size: 1.5rem; 
            text-align: center; 
            font-weight: bold; 
            animation: piscar 2s infinite; 
        }
        @keyframes piscar { 
            0% { opacity: 1; } 
            50% { opacity: 0.7; } 
            100% { opacity: 1; } 
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #aaa;">MONITORAMENTO DE ALERTAS ATIVOS</h1>
    
    <div id="lista-alertas">
        <!-- Os alertas aparecerão aqui -->
    </div>

    <script>
        const audioAlerta = new Audio('alerta.mp3');
        audioAlerta.loop = true;

        async function carregarAlertas() {
            try {
                // IP real atualizado
                const resposta = await fetch('http://GETIN-D19:8080/api/alertas/pendentes');
                const alertas = await resposta.json();
                
                const divLista = document.getElementById('lista-alertas');
                divLista.innerHTML = '';
                
                if (alertas.length === 0) {
                    divLista.innerHTML = '<h2 style="text-align: center; color: #4CAF50;">Nenhum chamado ativo no momento.</h2>';
                    audioAlerta.pause();
                    audioAlerta.currentTime = 0;
                    return;
                }

                // Tenta tocar o áudio automaticamente se houver pendências
                if (audioAlerta.paused) {
                    audioAlerta.play().catch(e => {
                        console.warn("O navegador bloqueou o áudio. É necessário configurar o atalho com a flag de autoplay.");
                    });
                }

                alertas.forEach(alerta => {
                    const dataFormatada = new Date(alerta.dataHora).toLocaleTimeString('pt-BR');
                    divLista.innerHTML += `
                        <div class="alerta-card">
                            🚨 PÂNICO ACIONADO - SETOR: ${alerta.setor.toUpperCase()} <br>
                            <span style="font-size: 1rem;">Máquina: ${alerta.nomeMaquina} | Usuário: ${alerta.usuarioAd} | Horário: ${dataFormatada}</span>
                        </div>
                    `;
                });
            } catch (erro) {
                console.error("Erro ao buscar dados:", erro);
            }
        }

        carregarAlertas();
        setInterval(carregarAlertas, 3000);
    </script>
</body>
</html>
