<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Botão do Pânico</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 300px; text-align: center; }
        .login-box h2 { margin-top: 0; color: #333; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-top: 15px; }
        button:hover { background: #45a049; }
        .erro { color: red; font-size: 0.9rem; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Acesso Restrito</h2>
        <input type="text" id="login" placeholder="Usuário (ex: admin)">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="entrar()">Entrar</button>
        <div id="mensagem-erro" class="erro">Usuário ou senha inválidos!</div>
    </div>

    <script>
        async function entrar() {
            const loginDigitado = document.getElementById('login').value;
            const senhaDigitada = document.getElementById('senha').value;
            const msgErro = document.getElementById('mensagem-erro');

            try {
                // Envia os dados para a nossa nova rota Java (usando o IP correto)
                const resposta = await fetch('http://GETIN-D19:8080/api/usuarios/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: loginDigitado, senha: senhaDigitada })
                });

                if (resposta.ok) {
                    const usuario = await resposta.json();
                    
                    // Salva as informações do usuário no navegador
                    localStorage.setItem('usuarioLogado', usuario.nome);
                    localStorage.setItem('perfilUsuario', usuario.perfil);
                    
                    // Vai para a tela de gerenciamento
                    window.location.href = 'index.html';
                } else {
                    // Exibe a mensagem de erro se a senha estiver errada
                    msgErro.style.display = 'block';
                }
            } catch (erro) {
                alert("Erro ao conectar com o servidor.");
            }
        }
    </script>
</body>
</html>
