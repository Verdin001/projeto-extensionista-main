# Configuração de Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_triagem?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# Comportamento do banco de dados e criação automática de tabelas (JPA/Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Desativa o painel do H2, pois o banco agora é o MySQL
spring.h2.console.enabled=false